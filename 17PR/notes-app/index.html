<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#376a64">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Заметки и напоминания — практика 17</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icons/icon-72x72.png" sizes="72x72" type="image/png">
</head>

<body>
    <header class="app-header">
        <div class="container header-inner">
            <div class="title-block">
                <span class="eyebrow">Практическая работа 17</span>
                <h1>Заметки и напоминания</h1>
                <p>Короткие записи, напоминания и офлайн-доступ в одном простом приложении.</p>
            </div>

            <nav class="tabs app-tabs" aria-label="Навигация">
                <button id="home-btn" class="tab active">Заметки</button>
                <button id="about-btn" class="tab">Справка</button>
            </nav>
        </div>
    </header>

    <main id="app-content" class="container app-main"></main>

    <footer class="container app-footer">
        <button id="enable-push" class="button success">Включить push</button>
        <button id="disable-push" class="button error" style="display:none;">Отключить push</button>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>

</html>
