<div class="workspace">
    <section class="note-panel" aria-label="Формы заметок">
        <div class="form-card">
            <h2>Быстрая заметка</h2>
            <p>Сохраните мысль, задачу или идею прямо в браузере.</p>
            <form id="note-form" class="note-form">
                <input type="text" id="note-input" placeholder="Текст заметки" required>
                <button class="button primary" type="submit">Сохранить</button>
            </form>
        </div>

        <div class="form-card">
            <h2>Напоминание</h2>
            <p>Укажите время, чтобы приложение отправило push-уведомление.</p>
            <form id="reminder-form" class="note-form">
                <input type="text" id="reminder-text" placeholder="О чем напомнить" required>
                <input type="datetime-local" id="reminder-time" required>
                <button class="button success" type="submit">Добавить напоминание</button>
            </form>
        </div>
    </section>

    <section class="notes-panel">
        <div class="section-head">
            <div>
                <h2>Мои записи</h2>
                <p>Новые заметки показываются первыми и хранятся локально.</p>
            </div>
        </div>
        <ul id="notes-list" class="notes-list"></ul>
    </section>
</div>
