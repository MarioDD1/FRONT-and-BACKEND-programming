<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Заметки — практика 14</title>

    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#4a7c3f">
    <meta name="description" content="Простое приложение для заметок с офлайн-режимом">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Заметки">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">

    <meta name="msapplication-TileColor" content="#4a7c3f">
    <meta name="msapplication-TileImage" content="./icons/icon-192x192.png">

    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <style>
        body { max-width: 680px; margin: 0 auto; padding: 1rem; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        h1 { margin: 0; }
        #offline-banner {
            display: none;
            background: #f0ad4e;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
        }
        #offline-banner.visible { display: block; }
        #note-form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        #note-input { flex: 1; }
        #notes-list {
            margin-top: 0;
            padding-left: 0;
        }
        #notes-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
            list-style: none;
        }
        @media (max-width: 560px) {
            header,
            #note-form {
                display: block;
            }
            #note-input,
            #note-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Мои заметки</h1>
        <div id="offline-banner">Офлайн</div>
    </header>

    <form id="note-form">
        <input type="text" id="note-input" placeholder="Напишите заметку" required>
        <button class="button primary" type="submit">Добавить</button>
    </form>

    <h2>Сохраненные записи</h2>
    <ul id="notes-list"></ul>

    <script src="app.js"></script>
</body>

</html>
